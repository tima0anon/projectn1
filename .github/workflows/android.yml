name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Verify chess rules and game flows
        run: |
          npm install --ignore-scripts
          npm test
      - name: Compile embedded Stockfish for ARM64 and x86_64
        run: bash scripts/build-engine.sh
      - name: Build APK and instrumentation tests
        run: |
          gradle wrapper
          gradle assembleDebug assembleDebugAndroidTest --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -q android.permission.INTERNET; then exit 1; fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual Android app and local Stockfish
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace
      - name: Prepare installable APK and complete source
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OfflineChess-1.0.0.apk
          mkdir -p app/src/main/assets/licenses
          cp LICENSE app/src/main/assets/licenses/GPL-3.0.txt
          cp NOTICE.md app/src/main/assets/licenses/NOTICE.md
          zip -q -r dist/OfflineChess-1.0.0-source.zip . -x '.git/*' '.gradle/*' 'node_modules/*' 'dist/*' 'app/build/*' 'local.properties'
          cd dist
          sha256sum OfflineChess-1.0.0.apk OfflineChess-1.0.0-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineChess-APK-and-source
          path: dist/
      - name: Publish verified files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Офлайн-шахматы 1.0.0" --notes "APK для Android 8+ (ARM64 и x86_64). Встроенный Stockfish 16.1. Выбор приблизительного Elo и цвета, отмена хода, автосохранение, архив и экспорт PGN. Сборка, подпись и тесты на эмуляторе Android 15 проверены автоматически. Полные исходники, NNUE и лицензии включены в архив."
